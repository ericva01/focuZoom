name: "Release Glideo"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon macOS (M1/M2/M3/M4) -> produces .dmg and .app
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            description: "macOS Apple Silicon (.dmg)"

          # Intel macOS -> produces .dmg and .app
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            description: "macOS Intel (.dmg)"

          # Linux Ubuntu / Debian -> produces .deb and .AppImage
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            description: "Linux (.AppImage and .deb)"

          # Windows x64 -> produces .exe (NSIS) and .msi
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            description: "Windows x64 (.exe and .msi)"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Glideo ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Glideo Desktop Multi-Platform Release
            
            Download the native installer for your operating system:
            
            ### 🍎 macOS
            - **Apple Silicon (M1 / M2 / M3 / M4)**: `Glideo_..._aarch64.dmg`
            - **Intel Mac**: `Glideo_..._x64.dmg`
            
            ### 🐧 Linux
            - **Universal Linux (Recommended)**: `Glideo_..._amd64.AppImage` *(Run: `chmod +x Glideo*.AppImage && ./Glideo*.AppImage`)*
            - **Debian / Ubuntu / Linux Mint**: `glideo_..._amd64.deb` *(Run: `sudo dpkg -i glideo*.deb`)*
            
            ### 🪟 Windows
            - **Windows 10 / 11 64-bit**: `Glideo_..._x64-setup.exe` (or `.msi`)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
